services:
  backend:
    build: .
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    ports:
      - 80:80
      - 3000:3000
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:9
    restart: always
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - ${MYSQL_PORT}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      timeout: 5s
      retries: 5
      interval: 5s
volumes:
  media:
  db-data:
